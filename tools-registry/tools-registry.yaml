tools:
  - name: projects
    description: "CLI for the personal projects tracker (list/add/filter tracked repos)."
    source: nix-managed

  - name: tools-registry
    description: "CLI for this tool/utils registry itself."
    source: nix-managed

  - name: zellij-sessionizer
    description: "fzf-driven zellij session picker/creator for project directories."
    source: nix-managed

  - name: render-pdf
    description: "Markdown -> Typst -> PDF renderer with mermaid diagrams as vector SVG."
    source: nix-managed

  - name: read-pdf
    description: "PDF -> plain text and annotations via PyMuPDF (uv run --script), for cheap local reading instead of vision-based page parsing."
    source: nix-managed

  - name: agent-status-wrap
    description: "Wraps an agent CLI (Claude Code) and reflects its working/blocked/idle state in the current zellij tab name."
    source: nix-managed

  - name: glab
    description: "GitLab CLI."
    source: homebrew

  - name: gh
    description: "GitHub CLI."
    source: homebrew

  - name: openproject-cli
    description: "OpenProject CLI; not packaged in nixpkgs/Homebrew, bootstrapped via go install."
    source: go-install

  - name: hdiff
    description: "Side-by-side diff of two files, rendered to HTML and opened in the browser."
    source: nix-managed

  - name: binoculars
    description: "Local AI-generated-text detector (Binoculars method) via MLX, default Qwen2.5-7B pair, no built-in threshold (needs local calibration). Apple Silicon only."
    source: nix-managed
